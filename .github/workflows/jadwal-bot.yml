name: Auto Bot Tracker UT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  jalankan-bot:
    runs-on: ubuntu-latest
    # Cegah dua run jalan bersamaan — run ke-2 menunggu run ke-1 selesai
    concurrency:
      group: tracker-bot-run
      cancel-in-progress: false

    steps:
      - name: Ambil Kodingan
        uses: actions/checkout@v4

      - name: Siapin Mesin Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Bikin File env
        run: |
          echo "UT_NIM=${{ secrets.UT_NIM }}" >> .env
          echo "UT_PASS=${{ secrets.UT_PASS }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" >> .env
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env

      - name: Masak Kodingan
        run: mvn clean package

      - name: Jalanin Bot
        run: sh -c "java -jar target/*-jar-with-dependencies.jar"
